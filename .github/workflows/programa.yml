name: Programa para Windows

# Gera o instalador do Caras E Telas sempre que algo em desktop/ muda.
# Também dá para rodar na mão: aba Actions → "Programa para Windows" → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/programa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: programa-windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testar as regras de segurança
        run: node teste-regras.js

      - name: Compilar o ajudante de som (C++)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" >nul || exit /b 1
          if not exist nativo\bin mkdir nativo\bin
          cl /nologo /O2 /MT /EHsc /std:c++17 /W3 /utf-8 /DUNICODE /D_UNICODE nativo\som-programa.cpp /Fo:nativo\bin\ /Fe:nativo\bin\som-programa.exe /link ole32.lib oleaut32.lib mmdevapi.lib version.lib user32.lib dwmapi.lib || exit /b 1
          nativo\bin\som-programa.exe --versao || exit /b 1

      - name: Testar o ajudante de som (lista de programas)
        shell: pwsh
        run: |
          $saida = & ./nativo/bin/som-programa.exe --listar --ignorar 0
          Write-Output $saida
          $null = $saida | ConvertFrom-Json

      - name: Montar o instalador
        run: npx electron-builder --win --x64 --publish never

      - name: Testar o programa montado (abre o site, confere bloqueios e captura)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "dist/win-unpacked" -Filter "*.exe" | Where-Object { $_.Name -like 'Caras*' } | Select-Object -First 1
          $saida = Join-Path $env:RUNNER_TEMP 'teste-rapido.json'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--teste-rapido=$saida" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error 'O programa não terminou o teste a tempo'; exit 1 }
          if (Test-Path $saida) { Get-Content $saida | Write-Output } else { Write-Error 'O teste não gerou resultado'; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "O teste do programa falhou (código $($p.ExitCode))"; exit 1 }

      - name: Guardar o instalador desta execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: |
            desktop/dist/*.exe
            desktop/dist/latest.yml
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          if gh release view "v$VERSAO" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::A versão $VERSAO já está publicada. Para publicar outra, aumente a versão em desktop/package.json."
            exit 0
          fi
          cat > notas.md <<'FIM'
          Baixe **Caras-E-Telas-Instalador.exe** e abra.

          Na primeira vez, o Windows pode mostrar "O Windows protegeu o computador": clique em **Mais informações → Executar assim mesmo**. Isso aparece porque o programa não tem certificado pago, não porque tenha algo errado.

          Quem já tem o programa recebe esta versão sozinho.
          FIM
          gh release create "v$VERSAO" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Caras E Telas $VERSAO" --notes-file notas.md \
            dist/Caras-E-Telas-Instalador.exe dist/Caras-E-Telas-Instalador.exe.blockmap dist/latest.yml

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telinha</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235865f2'/%3E%3Crect x='7' y='9' width='18' height='12' rx='2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M12 25h8' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Tela de entrada -->
  <div id="login" class="login">
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="login-logo" id="loginLogo"></div>
      <h1 id="loginTitle">Bem-vindo!</h1>
      <p class="muted" id="loginSub">Entre para conversar e compartilhar a tela com a galera.</p>
      <label class="field">
        <span>Apelido</span>
        <input id="nameInput" name="nickname" maxlength="32" required autocomplete="nickname" placeholder="Como seus amigos te chamam">
      </label>
      <div class="field">
        <span>Sua cor</span>
        <div id="colorPicker" class="color-picker"></div>
      </div>
      <label class="field" id="passField" hidden>
        <span>Senha do servidor</span>
        <input id="passInput" type="password" autocomplete="current-password">
      </label>
      <label class="field" id="adminField" hidden>
        <span>Senha de admin</span>
        <input id="adminInput" type="password" autocomplete="off">
      </label>
      <button type="submit" class="btn primary block" id="loginBtn">Entrar</button>
      <p id="loginError" class="error" role="alert"></p>
      <button type="button" class="link-btn" id="adminToggle">Sou admin</button>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="app" hidden>
    <nav class="rail" aria-label="Servidores">
      <div class="rail-server" id="railServer"></div>
      <div class="rail-sep"></div>
    </nav>

    <aside class="sidebar" id="sidebar">
      <header class="sidebar-header">
        <span id="serverName" class="ellipsis"></span>
        <span class="lock-badge" id="lockBadge" title="Servidor trancado: ninguém novo consegue entrar" hidden>trancado</span>
        <span class="header-btns">
          <button class="icon-btn small admin-btn" id="adminBtn" title="Painel de admin" hidden></button>
          <button class="icon-btn small" id="inviteBtn" title="Copiar link de convite"></button>
        </span>
      </header>
      <div class="channels" id="channels"></div>

      <div class="voice-panel" id="voicePanel" hidden>
        <div class="vp-info" id="vpInfo" title="Voltar para a sala">
          <div class="vp-status" id="vpStatus">Na sala</div>
          <div class="vp-where ellipsis" id="vpWhere"></div>
        </div>
        <button class="icon-btn" id="vpShare" title="Compartilhar tela"></button>
        <button class="icon-btn danger" id="vpLeave" title="Sair da sala"></button>
      </div>

      <div class="user-panel">
        <div class="avatar" id="meAvatar"></div>
        <div class="up-name">
          <div id="meName" class="ellipsis"></div>
          <div class="muted small" id="meStatus">Online</div>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Sair do servidor"></button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <main class="main">
      <header class="main-header">
        <button class="icon-btn mobile-only" id="menuBtn" title="Canais"></button>
        <span class="header-icon" id="headerIcon"></span>
        <span class="header-title ellipsis" id="headerTitle"></span>
        <span class="header-sub ellipsis" id="headerSub"></span>
        <div class="header-actions">
          <button class="icon-btn" id="toggleChatBtn" title="Mostrar/ocultar chat da sala" hidden></button>
          <button class="icon-btn" id="toggleMembersBtn" title="Lista de membros"></button>
        </div>
      </header>
      <div class="conn-banner" id="connBanner" hidden>Reconectando…</div>
      <div class="announce" id="announce" hidden></div>

      <div class="main-body">
        <section class="stage" id="stage" hidden>
          <div class="stage-people" id="stagePeople"></div>
          <div class="stage-grid" id="stageGrid"></div>
          <div class="stage-empty" id="stageEmpty"></div>
          <div class="stage-controls" id="stageControls">
            <label class="quality" title="De onde vem o som da sua transmissão">
              <span class="muted small">Som</span>
              <select id="somSelect">
                <option value="janela">Só da aba ou janela (sem eco)</option>
                <option value="pc">PC inteiro</option>
                <option value="nenhum">Sem som</option>
              </select>
            </label>
            <label class="quality" title="Qualidade da sua transmissão">
              <span class="muted small">Qualidade</span>
              <select id="qualitySelect"></select>
            </label>
            <button class="btn primary" id="shareBtn"></button>
            <button class="btn green" id="joinBtn"></button>
            <button class="btn danger" id="leaveBtn"></button>
          </div>
        </section>

        <section class="chat" id="chat">
          <div class="messages" id="messages"></div>
          <div class="composer-wrap">
            <div class="cmd-suggest" id="cmdSuggest" hidden></div>
            <form class="composer" id="composer">
              <textarea id="msgInput" rows="1" maxlength="2000" placeholder="Conversar"></textarea>
              <button type="submit" class="icon-btn" id="sendBtn" title="Enviar"></button>
            </form>
            <div class="typing" id="typing"></div>
          </div>
        </section>

        <aside class="members" id="members"></aside>
      </div>
    </main>
  </div>

  <div id="adminPanel" class="modal admin-modal" hidden></div>

  <div id="modal" class="modal" hidden>
    <form class="modal-card" id="modalForm">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modalCancel">Cancelar</button>
        <button type="submit" class="btn primary" id="modalOk">OK</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
